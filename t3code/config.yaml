name: T3 Code
version: 0.5.2
slug: t3code
description: Web GUI for AI coding agents — Claude, Codex, and more
url: https://github.com/danbuhler/hat3
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
stdin: true
ports:
  3773/tcp: 3773
ports_description:
  3773/tcp: T3 Code web interface
webui: "http://[HOST]:[PORT:3773]"

# Filesystem access — Claude Code needs read/write to manage HA
map:
  - config:rw
  - share:rw
  - ssl:ro
  - media:rw
  - backup:rw
  - addons:ro

# API access — full admin for complete HA management
homeassistant_api: true
hassio_api: true
hassio_role: admin
auth_api: true

# Re-downloaded on demand, so it does not need to be in every backup
backup_exclude:
  - t3code/runtime

options:
  machine_name: homeassistant
  extra_packages: []
schema:
  machine_name: str
  extra_packages:
    - match(^[a-z0-9][a-z0-9+.-]+$)
